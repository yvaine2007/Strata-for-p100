name: Build Strata P100 (self-compiled)

on:
  workflow_dispatch:
    inputs:
      strata_version:
        description: 'Strata 版本号 (格式: v<主>.<次>.<修订>，例如 v0.1.41 或 v0.1.40.2)'
        required: true
        type: string
      use_latest_tag:
        description: '是否同时打 p100-latest 标签'
        required: true
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Validate strata version
        run: |
          V="${{ inputs.strata_version }}"
          if [[ ! "$V" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "❌ 格式不正确: $V"
            echo "   期望格式: v<主>.<次>.<修订>[.<修订2>]"
            echo "   例如: v0.1.41 或 v0.1.40.2"
            exit 1
          fi
          echo "✅ 版本号格式正确: $V"

      - name: Checkout at specified tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.strata_version }}
          fetch-depth: 0

      - name: Verify checked-out version
        run: |
          echo "=== HEAD commit ==="
          git log -1 --oneline
          echo "=== Exact tag ==="
          git describe --tags --exact-match 2>/dev/null || echo "(not exactly on a tag)"
          echo "=== setup.py source version (if available) ==="
          python3 -c "import setup; print('source_version:', setup.source_version())" 2>/dev/null || echo "(setup.py not importable, skipping)"

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo rm -rf /usr/local/share/boost /usr/share/swift /usr/local/share/chromium
          df -h /

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_USER }}
          password: ${{ secrets.ALIYUN_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute tags
        id: tags
        run: |
          REG="${{ secrets.ALIYUN_REGISTRY }}/${{ secrets.ALIYUN_REGISTRY_NAMESPACE }}/strata"
          V="${{ inputs.strata_version }}"
          TAGS="${REG}:${V}-p100"
          if [[ "${{ inputs.use_latest_tag }}" == "true" ]]; then
            TAGS="${TAGS}"$'\n'"${REG}:p100-latest"
          fi
          echo "tags<<EOF" >> $GITHUB_OUTPUT
          echo "$TAGS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "将推送以下 tag:"
          echo "$TAGS"

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.self-20261010.self
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            CUDA_ARCHITECTURES=60
            BUILD_VISION=1
          provenance: false
          sbom: false
          cache-from: type=gha,scope=strata-${{ inputs.strata_version }}
          cache-to: type=gha,mode=max,scope=strata-${{ inputs.strata_version }}
